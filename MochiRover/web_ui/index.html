<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Mochi Rover</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- First-run provisioning (AP mode only) -->
  <div id="setupGate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-brand">🤖</div>
      <h1>Mochi</h1>
      <p class="muted">The rover is in setup mode. Enter your Wi-Fi network so it can connect.</p>
      <label>Wi-Fi SSID</label>
      <input id="setupSsid" autocomplete="off" spellcheck="false">
      <label>Password</label>
      <input id="setupPass" type="password" autocomplete="off">
      <button id="setupSave" class="primary">Connect</button>
      <div id="setupMsg" class="err"></div>
    </div>
  </div>

  <!-- Access token gate -->
  <div id="authGate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-brand">🤖</div>
      <h1>Mochi</h1>
      <p class="muted">Enter the rover access token to unlock the cockpit.</p>
      <label>Access token</label>
      <input id="authToken" type="password" autocomplete="off" spellcheck="false">
      <button id="authBtn" class="primary">Unlock</button>
      <div id="authErr" class="err"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header id="topbar">
      <div class="brand">🤖 Mochi</div>
      <div class="status-pill">
        <span class="dot" id="dotCtrl"></span><span class="dot-label">CTRL</span>
        <span class="pill-sep"></span>
        <span class="dot" id="dotCam"></span><span class="dot-label">CAM</span>
      </div>
      <div class="top-actions">
        <button id="flashBtn" class="icon" title="flashlight">🔦</button>
        <button id="moodBtn" class="icon" title="mood">👀</button>
        <button id="settingsBtn" class="icon" title="settings">⚙️</button>
      </div>
    </header>

    <div class="video-panel">
      <img id="video" alt="live camera feed">
      <div class="video-actions">
        <button id="flipBtn" class="vbtn" title="flip / refresh">🔄</button>
        <button id="photoBtn" class="vbtn" title="capture photo">📷</button>
        <button id="recBtn" class="vbtn" title="record clip">●</button>
      </div>
      <div id="videoBadge" class="video-badge hidden"></div>
    </div>

    <div class="ctrl-wrap">
      <div class="ctrl-group">
        <div class="ctrl-btns">
          <button id="btnLeft" class="ctrl" title="left">◀</button>
          <button id="btnRight" class="ctrl" title="right">▶</button>
        </div>
        <div class="ctrl-label">STEERING</div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-btns">
          <button id="btnUp" class="ctrl" title="forward">▲</button>
          <button id="btnDown" class="ctrl" title="back">▼</button>
        </div>
        <div class="ctrl-label">THROTTLE</div>
      </div>
    </div>

    <div class="deck">
      <div class="msg-row">
        <input id="msgInput" maxlength="32" placeholder="Message to OLED..." autocomplete="off">
        <button id="msgSend">Send</button>
        <button id="msgClear" class="ghost hidden" title="clear message">✕</button>
      </div>
      <div class="deck-row">
        <label class="row-label">Mood</label>
        <select id="moodSelect">
          <option value="idle">😶 Idle</option>
          <option value="happy">😊 Happy</option>
          <option value="angry">😡 Angry</option>
          <option value="curious">🤔 Curious</option>
          <option value="dead">😵 Dead</option>
          <option value="sleepy">😴 Sleepy</option>
          <option value="wink">😉 Wink</option>
        </select>
        <div class="speed-box">
          <label class="row-label" for="speed">Speed:</label>
          <input id="speed" type="range" min="0" max="255" value="255" step="1">
          <output id="speedVal">255</output>
        </div>
      </div>
    </div>
  </div>

  <!-- Mood popup (white rounded card under the header) -->
  <div id="moodPopup" class="mood-popup hidden">
    <button class="mood-opt" data-mood="happy">😊 Happy</button>
    <button class="mood-opt" data-mood="angry">😡 Angry</button>
    <button class="mood-opt" data-mood="curious">🤔 Curious</button>
    <button class="mood-opt" data-mood="dead">😵 Dead</button>
    <button class="mood-opt" data-mood="sleepy">😴 Sleepy</button>
    <button class="mood-opt" data-mood="wink">😉 Wink</button>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Rover Connection &amp; Settings</h2>
        <button id="settingsClose" class="icon" title="close">✕</button>
      </div>
      <label>Rover IP / Domain</label>
      <input id="setIp" placeholder="192.168.4.1" spellcheck="false">
      <label>Theme</label>
      <select id="setTheme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
      <label>Access token</label>
      <input id="setToken" type="password" placeholder="new token (optional)" autocomplete="off">
      <div class="modal-actions">
        <button id="settingsSave" class="primary">Save</button>
      </div>
      <div id="settingsMsg" class="err"></div>
    </div>
  </div>

<script src="/app.js"></script>
</body>
</html>
