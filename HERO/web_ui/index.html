<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117">
<title>HERO</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="authGate" class="gate hidden" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-card">
      <div class="logo-mark" aria-hidden="true">H</div>
      <h1 id="gateTitle">HERO</h1>
      <p class="muted">Enter the rover access token to unlock the cockpit.</p>
      <label for="authToken">Access token</label>
      <input id="authToken" type="password" autocomplete="off" spellcheck="false" autocapitalize="off">
      <button id="authBtn" class="primary">Unlock</button>
      <div id="authErr" class="err" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header id="topbar">
      <div class="brand"><span class="logo-mark sm" aria-hidden="true">H</span> HERO</div>
      <div class="status-pill" role="status" aria-live="polite" aria-label="Link status">
        <span class="dot" id="dotCtrl" aria-hidden="true"></span><span class="dot-label">CTRL</span>
        <span class="pill-sep" aria-hidden="true"></span>
        <span class="dot" id="dotCam" aria-hidden="true"></span><span class="dot-label">CAM</span>
      </div>
      <div class="top-actions">
        <button id="streamBtn" class="icon on" title="Stop camera" aria-label="Stop camera" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><path d="M17 10l6-3v10l-6-3z"/><path class="cam-slash" d="M3 3l18 18"/></svg>
        </button>
        <button id="moodBtn" class="icon" title="Mood" aria-label="Mood" aria-haspopup="menu" aria-expanded="false" aria-controls="moodPopup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="11" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1.4" fill="currentColor" stroke="none"/><path d="M8.5 15c1.2 1.4 5.8 1.4 7 0"/></svg>
        </button>
        <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="video-panel" id="videoPanel">
      <img id="video" alt="Live camera feed">
      <div id="videoOffline" class="video-offline">
        <div class="spinner" aria-hidden="true"></div>
        <span>Connecting to camera...</span>
      </div>
      <div class="video-actions">
        <button id="flipBtn" class="vbtn" title="Flip / refresh" aria-label="Flip camera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg>
        </button>
        <button id="photoBtn" class="vbtn" title="Capture photo" aria-label="Capture photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
        </button>
        <button id="recBtn" class="vbtn rec" title="Record clip" aria-label="Record clip" aria-pressed="false">
          <span class="rec-dot" aria-hidden="true"></span>
        </button>
      </div>
      <div id="videoBadge" class="video-badge hidden" role="status" aria-live="polite"></div>
    </div>

    <div class="cockpit">
      <div class="dpad" role="group" aria-label="Drive pad">
        <button id="btnUp" class="ctrl" title="Forward" aria-label="Forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
        </button>
        <button id="btnLeft" class="ctrl" title="Left" aria-label="Left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
        </button>
        <button id="btnRight" class="ctrl" title="Right" aria-label="Right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
        </button>
        <button id="btnDown" class="ctrl" title="Back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="cockpit-side">
        <div class="side-row">
          <label class="row-label" for="moodSelect">Mood</label>
          <select id="moodSelect">
            <option value="idle">Idle</option>
            <option value="happy">Happy</option>
            <option value="angry">Angry</option>
            <option value="curious">Curious</option>
            <option value="dead">Dead</option>
            <option value="sleepy">Sleepy</option>
            <option value="wink">Wink</option>
          </select>
        </div>
        <div class="side-row speed-box">
          <label class="row-label" for="speed">Speed</label>
          <input id="speed" type="range" min="0" max="255" value="255" step="1">
          <output id="speedVal">255</output>
        </div>
      </div>
    </div>

    <div class="deck">
      <div class="msg-row">
        <label class="sr-only" for="msgInput">Message to show on the OLED</label>
        <input id="msgInput" maxlength="32" placeholder="Message to OLED..." autocomplete="off">
        <button id="msgSend">Send</button>
        <button id="msgClear" class="ghost hidden" title="Clear message" aria-label="Clear message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <p class="sr-only" id="msgLive" role="status" aria-live="polite"></p>
    </div>
  </div>

  <div id="moodPopup" class="mood-popup hidden" role="menu" aria-label="Face mood">
    <button class="mood-opt" role="menuitem" data-mood="happy">Happy</button>
    <button class="mood-opt" role="menuitem" data-mood="angry">Angry</button>
    <button class="mood-opt" role="menuitem" data-mood="curious">Curious</button>
    <button class="mood-opt" role="menuitem" data-mood="dead">Dead</button>
    <button class="mood-opt" role="menuitem" data-mood="sleepy">Sleepy</button>
    <button class="mood-opt" role="menuitem" data-mood="wink">Wink</button>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="settingsTitle">Settings</h2>
        <button id="settingsClose" class="icon" title="Close" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <p class="muted settings-hint">Join Wi-Fi <strong>HERO</strong> (password <strong>hero1234</strong>) then open <strong>http://192.168.4.1</strong></p>
      <label>Flashlight</label>
      <label class="toggle-row"><input id="flashToggle" type="checkbox"> On-board LED</label>
      <label for="setTheme">Theme</label>
      <select id="setTheme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
      <label>Motors</label>
      <label class="toggle-row"><input id="revLeft" type="checkbox"> Reverse left motor</label>
      <label class="toggle-row"><input id="revRight" type="checkbox"> Reverse right motor</label>
      <p class="muted settings-hint">Trim a slower motor down so the rover tracks straight. 100% is full PWM.</p>
      <label class="trim-row" for="trimLeft">Left trim <output id="trimLeftVal">100</output>%</label>
      <input id="trimLeft" type="range" min="50" max="100" value="100" step="1">
      <label class="trim-row" for="trimRight">Right trim <output id="trimRightVal">100</output>%</label>
      <input id="trimRight" type="range" min="50" max="100" value="100" step="1">
      <label for="setToken">Access token</label>
      <input id="setToken" type="password" placeholder="new token (optional)" autocomplete="off" autocapitalize="off">
      <div class="modal-actions">
        <button id="settingsSave" class="primary">Save</button>
      </div>
      <div id="settingsMsg" class="err" role="status" aria-live="polite"></div>
    </div>
  </div>

  <noscript><p style="padding:20px;text-align:center">HERO needs JavaScript enabled.</p></noscript>

<script src="/app.js"></script>
</body>
</html>
